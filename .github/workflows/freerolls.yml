name: Freeroll passwords

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: freeroll-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRACKER_URL: ${{ vars.TRACKER_URL }}
          FEED_KEY: ${{ secrets.STATS_KEY }}
          POST_AHEAD_MINUTES: "30"
          SKIP_DEPOSIT_ONLY: "0"
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "freeroll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
