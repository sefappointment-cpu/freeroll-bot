name = "freeroll-go"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
TRACKER_URL = "https://freeroll-go.sichag.workers.dev"
POST_AHEAD_MINUTES = "30"

# Бот: проверка расписания каждые 2 минуты
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "freeroll-clicks"
database_id = "cac271e8-27e0-4f9b-80bd-3f8ee20c90bc"

# Объект, который забирает расписание с сайта всегда из Западной Европы
[[durable_objects.bindings]]
name = "FEED"
class_name = "FeedFetcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedFetcher"]
